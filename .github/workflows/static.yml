<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Bird</title>

  <style>
    body {
      margin: 1;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow: hidden;
    }

    canvas {
      background: #87CEEB;
      border: 2px solid #222;
      border-radius: 12px;
      width: 95vw;
      max-width: 400px;
      height: auto;
      touch-action: manipulation;
    }

    button {
      display: none;
      margin-top: 10px;
      padding: 14px 28px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 12px;
      border: none;
      background: gold;
    }
  </style>
</head>

<body>

<h2>Flappy Bird</h2>
<p>Tippe auf den Bildschirm, Mausklick oder Leertaste</p>

<canvas id="game" width="400" height="600"></canvas>
<br>
<button id="restart">Neu starten</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const restartBtn = document.getElementById("restart");

let W = canvas.width;
let H = canvas.height;

let bird;
let pipes;
let score;
let bestScore = Number(localStorage.getItem("bestScore")) || 0;
let gameOver;
let started;
let frame;

function resetGame() {
  bird = {
    x: 90,
    y: 300,
    r: 16,
    v: 0
  };

  pipes = [];
  score = 0;
  frame = 0;
  gameOver = false;
  started = false;
  restartBtn.style.display = "none";
}

function jump() {
  if (gameOver) return;
  started = true;
  bird.v = -7.5;
}

function endGame() {
  gameOver = true;

  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem("bestScore", bestScore);
  }

  restartBtn.style.display = "inline-block";
}

function addPipe() {
  let top = Math.random() * 220 + 60;

  pipes.push({
    x: W,
    top: top,
    gap: 170,
    w: 70,
    passed: false
  });
}

function update() {
  if (!started || gameOver) return;

  frame++;

  bird.v += 0.45;
  bird.y += bird.v;

  if (frame % 90 === 0) {
    addPipe();
  }

  for (let pipe of pipes) {
    pipe.x -= 2.5;

    let bottomStart = pipe.top + pipe.gap;

    if (
      bird.x + bird.r > pipe.x &&
      bird.x - bird.r < pipe.x + pipe.w &&
      (bird.y - bird.r < pipe.top || bird.y + bird.r > bottomStart)
    ) {
      endGame();
    }

    if (!pipe.passed && pipe.x + pipe.w < bird.x) {
      pipe.passed = true;
      score++;

      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem("bestScore", bestScore);
      }
    }
  }

  pipes = pipes.filter(pipe => pipe.x + pipe.w > 0);

  if (bird.y + bird.r > H - 45 || bird.y - bird.r < 0) {
    endGame();
  }
}

function draw() {
  ctx.fillStyle = "#87CEEB";
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = "white";
  ctx.beginPath();
  ctx.arc(80, 100, 20, 0, Math.PI * 2);
  ctx.arc(105, 90, 25, 0, Math.PI * 2);
  ctx.arc(135, 100, 20, 0, Math.PI * 2);
  ctx.fill();

  for (let pipe of pipes) {
    ctx.fillStyle = "green";
    ctx.fillRect(pipe.x, 0, pipe.w, pipe.top);
    ctx.fillRect(pipe.x, pipe.top + pipe.gap, pipe.w, H);
  }

  ctx.fillStyle = "#DEB887";
  ctx.fillRect(0, H - 45, W, 45);

  /* Roter Vogel */
  ctx.fillStyle = "red";
  ctx.beginPath();
  ctx.arc(bird.x, bird.y, bird.r, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "white";
  ctx.beginPath();
  ctx.arc(bird.x + 5, bird.y - 5, 5, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "black";
  ctx.beginPath();
  ctx.arc(bird.x + 7, bird.y - 5, 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "orange";
  ctx.beginPath();
  ctx.moveTo(bird.x + 14, bird.y);
  ctx.lineTo(bird.x + 28, bird.y + 5);
  ctx.lineTo(bird.x + 14, bird.y + 10);
  ctx.fill();

  ctx.fillStyle = "white";
  ctx.font = "bold 36px Arial";
  ctx.textAlign = "center";
  ctx.fillText(score, W / 2, 60);

  ctx.font = "20px Arial";
  ctx.fillText("Best: " + bestScore, W / 2, 90);

  if (!started && !gameOver) {
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(45, 230, 310, 90);

    ctx.fillStyle = "white";
    ctx.font = "24px Arial";
    ctx.fillText("Tippen zum Start", W / 2, 280);
  }

  if (gameOver) {
    ctx.fillStyle = "rgba(0,0,0,0.65)";
    ctx.fillRect(55, 220, 290, 130);

    ctx.fillStyle = "white";
    ctx.font = "bold 30px Arial";
    ctx.fillText("Game Over", W / 2, 260);

    ctx.font = "22px Arial";
    ctx.fillText("Score: " + score, W / 2, 295);
    ctx.fillText("Best: " + bestScore, W / 2, 325);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

document.addEventListener("keydown", function(e) {
  if (e.code === "Space") {
    jump();
  }
});

canvas.onclick = function() {
  jump();
};

canvas.ontouchstart = function(e) {
  e.preventDefault();
  jump();
};

restartBtn.onclick = function() {
  resetGame();
};

restartBtn.ontouchstart = function(e) {
  e.preventDefault();
  resetGame();
};

resetGame();
loop();
</script>

</body>
</html>
